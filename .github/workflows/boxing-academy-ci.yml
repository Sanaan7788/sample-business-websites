name: Boxing Academy CI

on:
  push:
    branches: [main]
    paths:
      - "boxing-academy/**"
  pull_request:
    paths:
      - "boxing-academy/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: boxing-academy

jobs:
  test:
    runs-on: ubuntu-latest

    # Postgres for migrations, build-time prerender, and E2E.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cactus_boxing
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/cactus_boxing?schema=public
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: boxing-academy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations + seed
        run: |
          npm run db:migrate:deploy
          npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit + integration tests
        run: npm test

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: boxing-academy/playwright-report
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cactus_boxing
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/cactus_boxing?schema=public
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: boxing-academy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations + seed
        run: |
          npm run db:migrate:deploy
          npm run db:seed

      - name: Build
        run: npm run build

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.x autorun

